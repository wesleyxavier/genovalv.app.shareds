<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genova Cloud — Shared Login Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <genova-auth-shell id="auth-shell">
      <div slot="actions" style="display:flex;align-items:center;gap:0.5rem;">
        <label for="locale-select" class="genova-hint-mono" style="position:absolute;left:-9999px;">Idioma</label>
        <select
          id="locale-select"
          aria-label="Selecionar idioma"
          style="font-size:0.75rem;padding:0.2rem 0.45rem;border-radius:0.25rem;border:1px solid var(--gnv-outline-variant);background:var(--gnv-surface-container-lowest);color:var(--gnv-on-surface);"
        >
          <option value="pt-BR" selected>PT-BR</option>
          <option value="en-US">EN-US</option>
          <option value="es-ES">ES-ES</option>
        </select>
      </div>

      <genova-auth-card id="auth-card">
        <genova-alert-banner id="form-alert" slot="feedback"></genova-alert-banner>

        <form id="login-form" class="genova-form" novalidate>
          <div class="genova-field">
            <label id="email-label" class="genova-label" for="login-email">E-mail Corporativo</label>
            <div class="genova-input-wrap">
              <span class="genova-input-icon" aria-hidden="true">@</span>
              <input
                id="login-email"
                name="email"
                type="email"
                class="genova-input"
                autocomplete="email"
                placeholder="nome@empresa.com"
                required
              />
            </div>
            <span id="email-error" class="genova-field-error" hidden></span>
          </div>

          <div class="genova-field">
            <div class="genova-field-header">
              <label id="password-label" class="genova-label" for="login-password">Senha</label>
              <a id="forgot-link" class="genova-link" href="#forgot-password">Esqueceu a senha?</a>
            </div>
            <div class="genova-input-wrap">
              <span class="genova-input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input
                id="login-password"
                name="password"
                type="password"
                class="genova-input genova-input--with-action"
                autocomplete="current-password"
                placeholder="••••••••••••"
                required
              />
              <button
                id="toggle-password"
                type="button"
                class="genova-input-action"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg id="toggle-eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <span id="password-error" class="genova-field-error" hidden></span>
          </div>

          <div id="mfa-field" class="genova-field" hidden>
            <div class="genova-field-header">
              <label id="mfa-label" class="genova-label" for="login-mfa">Código de Verificação (MFA)</label>
              <span id="mfa-hint" class="genova-hint-mono">App Authenticator</span>
            </div>
            <div class="genova-input-wrap">
              <span class="genova-input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
                </svg>
              </span>
              <input
                id="login-mfa"
                name="mfaCode"
                type="text"
                inputmode="numeric"
                class="genova-input genova-input--mono"
                placeholder="000 000"
              />
            </div>
            <span id="mfa-error" class="genova-field-error" hidden></span>
          </div>

          <genova-mfa-selector id="mfa-selector" hidden></genova-mfa-selector>

          <div class="genova-checkbox-row">
            <input id="remember-device" name="rememberDevice" type="checkbox" class="genova-checkbox" checked />
            <label id="remember-label" class="genova-checkbox-label" for="remember-device">
              Lembrar este dispositivo por 30 dias
            </label>
          </div>

          <genova-action-button id="submit-btn" type="submit" style="margin-top:0.25rem;"></genova-action-button>
        </form>
      </genova-auth-card>
    </genova-auth-shell>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genova Cloud — Shared Login Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <genova-auth-shell id="auth-shell">
      <div slot="actions" style="display:flex;align-items:center;gap:0.5rem;">
        <genova-locale-selector id="locale-select"></genova-locale-selector>
      </div>

      <genova-auth-card id="auth-card">
        <genova-alert-banner id="form-alert" slot="feedback"></genova-alert-banner>

        <form id="login-form" class="genova-form" novalidate>
          <genova-input
            id="login-email"
            name="email"
            type="email"
            icon="email"
            autocomplete="email"
            label="E-mail Corporativo"
            placeholder="nome@empresa.com"
            required
          ></genova-input>

          <genova-input
            id="login-password"
            name="password"
            type="password"
            icon="lock"
            autocomplete="current-password"
            label="Senha"
            placeholder="••••••••••••"
            action-label="Esqueceu a senha?"
            action-href="#forgot-password"
            show-password-toggle
            required
          ></genova-input>

          <genova-input
            id="login-mfa"
            name="mfaCode"
            type="text"
            icon="shield"
            inputmode="numeric"
            monospace
            label="Código de Verificação (MFA)"
            hint="App Authenticator"
            placeholder="000 000"
            hidden
          ></genova-input>

          <genova-mfa-selector id="mfa-selector" hidden></genova-mfa-selector>

          <genova-checkbox
            id="remember-device"
            name="rememberDevice"
            label="Lembrar este dispositivo por 30 dias"
            checked
          ></genova-checkbox>

          <genova-action-button id="submit-btn" type="submit" style="margin-top:0.25rem;"></genova-action-button>
        </form>
      </genova-auth-card>
    </genova-auth-shell>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

services:
  postgres:
    image: postgres:17-alpine
    container_name: genovalv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-GenovaIADB}
      POSTGRES_USER: ${POSTGRES_USER:-genovadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genova_dev_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${DOCKER_VOLUMES_ROOT:-C:/Docker-Volumes}/genova/new-shell/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genovadmin} -d ${POSTGRES_DB:-GenovaIADB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - genova-new-network

networks:
  genova-new-network:
    driver: bridge

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Cache de borda (usado apenas nas locations de estaticos)
  proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge_cache:10m max_size=256m inactive=10m use_temp_path=off;

  # Gerados por envsubst a partir de edge/nginx/templates (saida em /etc/nginx/edge.d)
  include /etc/nginx/edge.d/*.conf;
}
